# Pin the simulated Android SDK explicitly (Robolectric's default is the module targetSdk, which is
# also 36 — the pin makes the simulated-runtime choice visible instead of an inherited default).
# SDK 36 matches targetSdk. Robolectric 4.17 can also simulate 37, which stays unused while targetSdk
# is 36. Simulated SDK 36+ requires JDK 21 (the repo's JDK).
sdk=36
